    /* calm, cool, and badged: the claim can be checked */
    const g = ctx.createRadialGradient(0,0,2,0,0,22);
    g.addColorStop(0,"rgba(142,240,176,0.55)"); g.addColorStop(1,"rgba(142,240,176,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,22,0,6.28); ctx.fill();
    ctx.fillStyle = "#b9f5cf"; ctx.beginPath(); ctx.arc(0,0,11,0,6.28); ctx.fill();
    ctx.strokeStyle = "#2f8f5b"; ctx.lineWidth = 2; ctx.stroke();
    /* the ✓ source badge */
    ctx.fillStyle = "#1f7a4a"; ctx.beginPath(); ctx.arc(10,-10,7,0,6.28); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6.5,-10); ctx.lineTo(9,-7.5); ctx.lineTo(13.5,-13); ctx.stroke();
  } else {
    /* shinier and more certain: gold, sparkling, no badge */
    const pulse = reducedMotion() ? 0 : Math.sin(o.t*8)*2;
    const g = ctx.createRadialGradient(0,0,2,0,0,28 + pulse);
    g.addColorStop(0,"rgba(255,221,120,0.75)"); g.addColorStop(1,"rgba(255,221,120,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,28 + pulse,0,6.28); ctx.fill();
    ctx.fillStyle = "#ffe07a"; ctx.beginPath(); ctx.arc(0,0,12,0,6.28); ctx.fill();
    ctx.fillStyle = "#ffffff";
    for (let k=0;k<4;k++){
      const a = o.t*(reducedMotion() ? 0 : 1.5) + k*Math.PI/2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*17, Math.sin(a)*17, 1.8, 0, 6.28); ctx.fill();
    }
    if (hc){ ctx.setLineDash([3,3]); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0,0,16,0,6.28); ctx.stroke(); ctx.setLineDash([]); }
  }
  /* the claim */
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `${o.real ? 600 : 800} ${Math.round(11 * hudScale())}px ${FONT_UI}`;
  const tw = ctx.measureText(o.text).width + 12;
  ctx.fillStyle = o.real ? "rgba(10,40,25,0.85)" : "rgba(60,40,0,0.85)";
  ctx.fillRect(-tw/2, 17, tw, 16);
  ctx.fillStyle = o.real ? "#c8f7d8" : "#ffe9a8";
  ctx.fillText(o.text, 0, 25.5);
  ctx.restore();
}
function drawMote(m){
  ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.t*2);
  const g = ctx.createRadialGradient(0,0,1,0,0,16);
  g.addColorStop(0,"rgba(201,167,255,0.8)"); g.addColorStop(1,"rgba(201,167,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,16,0,6.28); ctx.fill();
  ctx.fillStyle = "#c9a7ff";
  ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(6,0); ctx.lineTo(0,8); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(3,0); ctx.lineTo(0,4); ctx.lineTo(-3,0); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawSeed(s){
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
  const g = ctx.createRadialGradient(0,0,1,0,0,10);
  g.addColorStop(0,"rgba(184,245,163,0.55)"); g.addColorStop(1,"rgba(184,245,163,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,10,0,6.28); ctx.fill();
  ctx.fillStyle = "#d8f7c2";
  ctx.beginPath(); ctx.ellipse(0,0,5,3,0,0,6.28); ctx.fill();
  ctx.fillStyle = "#6fae52";
  ctx.beginPath(); ctx.ellipse(1.5,0,2.2,1.2,0,0,6.28); ctx.fill();
  if (highContrast()){ ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(0,0,5,3,0,0,6.28); ctx.stroke(); }
  ctx.restore();
}
function drawGlimmer(g){
  ctx.save(); ctx.translate(g.x, g.y);
  const left = Math.max(0, (GLIM_LIFE - g.t) / GLIM_LIFE);
  /* a slow shimmer, about one cycle per second, never a fast flicker */
  const sh = reducedMotion() ? 0.9 : 0.6 + 0.4*Math.sin(g.t*6.28);
  ctx.globalAlpha = sh * Math.min(1, left * 4);
  const rg = ctx.createRadialGradient(0,0,2,0,0,30);
  rg.addColorStop(0,"rgba(255,233,168,0.8)"); rg.addColorStop(1,"rgba(255,233,168,0)");
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0,0,30,0,6.28); ctx.fill();
  ctx.fillStyle = "#fff3c4";
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(4,-4); ctx.lineTo(12,0); ctx.lineTo(4,4); ctx.lineTo(0,12); ctx.lineTo(-4,4); ctx.lineTo(-12,0); ctx.lineTo(-4,-4); ctx.closePath(); ctx.fill();
  /* the ring shrinks with the time left, so the deadline is visible without a number */
  ctx.globalAlpha = Math.min(1, left * 4);
  ctx.strokeStyle = highContrast() ? "#ffffff" : "rgba(255,233,168,0.7)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,0, 8 + 20*left, 0, 6.28); ctx.stroke();
  ctx.restore();
}
function drawSerpent(e){
  ctx.save();
  const fake = e.type === "phantom";
  const armed = !fake && e.armT <= 0;
  if (fake){
    /* the tell: faded, and no bright eyes. A slow shimmer, about one cycle per second, never a fast flicker */
    const sh = reducedMotion() ? 0.5 : 0.42 + 0.14*Math.sin(tGlobal*6.28 + e.sway);
    ctx.globalAlpha = Math.min(1, e.life / 0.8) * sh;
  }
  for (let k=SERP_SEGS-1;k>=0;k--){
    const q = e.hist[Math.min(e.hist.length - 1, (k + 1) * SERP_GAP)];
    if (!q) continue;
    const r = 5 + 6 * (1 - k/SERP_SEGS);
    if (!fake) ctx.globalAlpha = 0.95 - k*0.08;
    ctx.fillStyle = fake ? (k % 2 ? "#4a5c58" : "#5c7470") : (k % 2 ? "#2f7a5a" : "#3f9a6e");
    ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 6.28); ctx.fill();
    if (highContrast()){ ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.stroke(); }
    /* the part of the tail the head can bite is ringed once the serpent is armed */
    if (armed && k >= SERP_BITE_FROM){ ctx.strokeStyle = "rgba(255,209,102,0.6)"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(q.x, q.y, r + 2, 0, 6.28); ctx.stroke(); }
  }
  if (!fake) ctx.globalAlpha = 1;
  /* coil progress: one gold dot per crossing so far */
  for (let c=0;c<e.coils;c++){ ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(e.x - 8 + c*8, e.y - 24, 3, 0, 6.28); ctx.fill(); }
  ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.vy, e.vx));
  ctx.fillStyle = fake ? "#6f8a84" : e.hurt > 0 ? "#ffffff" : "#4fbf86";
  ctx.beginPath(); ctx.moveTo(16,0); ctx.quadraticCurveTo(6,-11,-10,-8); ctx.lineTo(-10,8); ctx.quadraticCurveTo(6,11,16,0); ctx.closePath(); ctx.fill();
  if (fake && (reducedMotion() || highContrast())){ ctx.setLineDash([4, 4]); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]); }
  else { ctx.strokeStyle = highContrast() ? "#ffffff" : fake ? "#3a4a46" : "#1f5a3c"; ctx.lineWidth = 1.5; ctx.stroke(); }
  if (fake){
    /* empty sockets where the eyes would be: the missing bright centre is the tell */
    ctx.fillStyle = "#2a3532";
    ctx.beginPath(); ctx.arc(4,-4,2.2,0,6.28); ctx.fill(); ctx.beginPath(); ctx.arc(4,4,2.2,0,6.28); ctx.fill();
    ctx.restore(); return;
  }
  ctx.fillStyle = "#ffd166";
  ctx.beginPath(); ctx.arc(4,-4,2.2,0,6.28); ctx.fill(); ctx.beginPath(); ctx.arc(4,4,2.2,0,6.28); ctx.fill();
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath(); ctx.arc(5,-4,1,0,6.28); ctx.fill(); ctx.beginPath(); ctx.arc(5,4,1,0,6.28); ctx.fill();
  if (!reducedMotion() && Math.sin(tGlobal*9) > 0.6){
    ctx.strokeStyle = "#ff5a76"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(24,-2); ctx.moveTo(16,0); ctx.lineTo(24,2); ctx.stroke();
  }
  ctx.restore();
}
function drawHook(e){
  ctx.save();
  const n = e.trail.length;
  for (let k=0;k<n;k++){
    const p = e.trail[k], q = (k+1)/n;
    ctx.globalAlpha = 0.25*q; ctx.fillStyle = "#6b4aa8";
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 + 9*q, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.vy, e.vx));
  const g = ctx.createRadialGradient(0,0,4,0,0,34);
  g.addColorStop(0,"rgba(157,123,255,0.45)"); g.addColorStop(1,"rgba(157,123,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,34,0,6.28); ctx.fill();
  /* body: a dark teardrop, the point leads */
  ctx.fillStyle = e.hurt > 0 ? "#ffffff" : "#2a1b4d";
  ctx.beginPath(); ctx.moveTo(18,0); ctx.quadraticCurveTo(4,-13,-14,-6); ctx.quadraticCurveTo(-22,0,-14,6); ctx.quadraticCurveTo(4,13,18,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = highContrast() ? "#ffffff" : "#9d7bff"; ctx.lineWidth = highContrast() ? 2.5 : 1.5; ctx.stroke();
  /* the hook itself: a curl at the tail */
  ctx.strokeStyle = "#c9a7ff"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-18, 0, 6, -1.2, 2.6); ctx.stroke();
  /* one red notification eye */
  ctx.fillStyle = "#ff2f4f";
  ctx.beginPath(); ctx.arc(8, 0, 3.6, 0, 6.28); ctx.fill();
  ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(9, -1, 1.2, 0, 6.28); ctx.fill();
  ctx.restore();
}
function drawHUD(){
  const cfg = LEVELS[level];
  const k = hudScale(), hc = highContrast();
  const font = (px, w, display) => `${w ? w + " " : ""}${Math.round(px * k)}px ${display ? FONT_DISPLAY : FONT_UI}`;
  const dimWhite = a => hc ? "#ffffff" : `rgba(255,255,255,${a})`;
  ctx.textBaseline = "top";
  /* hearts: empty hearts are outlined, so full versus empty never depends on color alone */
  ctx.font = font(22);
  for (let i=0;i<DIFF.hearts;i++){
    const x = 16 + i*26*k;
    if (i < hearts){ ctx.fillStyle = "#ff5a76"; ctx.fillText("♥", x, 12); }
    else if (hc){ ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.strokeText("♥", x, 12); }
    else { ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillText("♥", x, 12); }
  }
  /* charges */
  ctx.font = font(20);
  const slots = Math.max(DIFF.bursts, bursts);
  const row2 = 12 + 28*k;
  for (let i=0;i<slots;i++){
    const x = 16 + i*22*k;
    if (i < bursts){ ctx.fillStyle = "#c9a7ff"; ctx.fillText("✦", x, row2); }
    else if (hc){ ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.2; ctx.strokeText("✦", x, row2); }
    else { ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillText("✦", x, row2); }
  }
  ctx.fillStyle = dimWhite(0.45);
  ctx.font = font(10);
  const abLabel = abilityName(Math.min(level, LEVELS.length-1)).toUpperCase();
  ctx.fillText((usedTouch ? "DOUBLE-TAP = " : "2x SPACE or X = ") + abLabel, 16, row2 + 24*k);
  /* level + progress */
  ctx.textAlign = "center";
  ctx.fillStyle = dimWhite(0.85);
  ctx.font = font(15, 600, true);
  ctx.fillText(`${cfg.name} · ${cfg.concept}`, W/2, 12);
  const row = 12 + 20*k;
  if (!boss){
    ctx.fillStyle = dimWhite(0.55);
    ctx.font = font(12);
    ctx.fillText(`eagles turned back: ${killCount} / ${quota}`, W/2, row);
  } else if (boss.entered){
    const bw = 300;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(W/2-bw/2, row, bw, 10);
    ctx.fillStyle = boss.enraged ? "#ff5a3c" : "#ff8c1a";
    ctx.fillRect(W/2-bw/2, row, bw * Math.max(0, boss.hp/boss.maxhp), 10);
    ctx.strokeStyle = hc ? "#ffffff" : "rgba(255,255,255,0.5)";
    ctx.strokeRect(W/2-bw/2, row, bw, 10);
  }
  /* score */
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd166";
  ctx.font = font(18, 700);
  ctx.fillText(String(score), W-16, 12);
  if (DIFF !== DIFFS.normal){
    ctx.font = font(10, 600);
    ctx.fillStyle = dimWhite(0.55);
    ctx.fillText(DIFF.label.toUpperCase(), W-16, 12 + 22*k);
  }
  ctx.textAlign = "left";
}
function drawBanner(){
  if (!banner) return;
  const a = Math.min(1, banner.t*3, (banner.max - banner.t)*2);
  ctx.save();
  ctx.globalAlpha = Math.max(0, a);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff";
  ctx.font = `600 ${Math.round(34 * hudScale())}px ${FONT_DISPLAY}`;
  ctx.shadowColor = "#9d7bff"; ctx.shadowBlur = 24;
  if (banner.text) ctx.fillText(banner.text, W/2, H/2 - 40);
  if (banner.sub){
    ctx.font = `700 ${Math.round(17 * hudScale())}px ${FONT_UI}`;
    ctx.fillStyle = "#ffd166";
    ctx.fillText(banner.sub, W/2, H/2 - 4);
  }
  ctx.restore();
}
/* A held sky reads as a pale blue wash that fades as the window runs out, so the player can see
   how much stillness is left without another number on the screen. */
function drawStillness(){
  const k = Math.min(1, stillT / STILL_TIME);
  ctx.save();
  ctx.fillStyle = `rgba(159,231,255,${0.10 + 0.10*k})`;
  ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle = `rgba(200,245,255,${0.35*k})`;
  ctx.lineWidth = 3;
  ctx.strokeRect(6, 6, W-12, H-12);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = `rgba(230,250,255,${0.55*k})`;
  ctx.font = "600 12px " + FONT_UI;
  ctx.fillText("STILL", W/2, H - 22);   // bottom centre: the top strip already carries the level readout
  ctx.restore();
}
function draw(){
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  if (shake > 0) ctx.translate(rand(-shake,shake), rand(-shake,shake));
  drawBackground();
  if (highContrast()){ ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(-20,-20,W+40,H+40); }
  for (const s of seeds) drawSeed(s);
  for (const c of chunks) drawChunk(c);
  for (const m of motes) drawMote(m);
  for (const o of orbs) drawOrb(o);
  if (glimmer) drawGlimmer(glimmer);
  for (const e of eagles) (e.type === "hook" ? drawHook(e) : (e.type === "serpent" || e.type === "phantom") ? drawSerpent(e) : drawEagle(e));
  if (boss) drawBoss();
  for (const f of fires) drawFire(f);
  /* bullets */
  for (const b of bullets){
    const ang = b.vy ? Math.atan2(b.vy, b.vx) : 0;
    ctx.fillStyle = "rgba(150,230,255,0.35)";
    ctx.beginPath(); ctx.ellipse(b.x - 8*Math.cos(ang), b.y - 8*Math.sin(ang), 12, 3.5, ang, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#eafcff";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill();
  }
  /* particles */
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    if (p.shape === "feather") ctx.ellipse(p.x, p.y, p.r * 1.9, p.r * 0.6, p.rot, 0, 6.28);
    else ctx.arc(p.x, p.y, p.r, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (pops.length){
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `800 ${Math.round(15 * hudScale())}px ${FONT_UI}`;
    for (const q of pops){
      ctx.globalAlpha = Math.max(0, 1 - q.t / 0.9);
      ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillText(q.text, q.x + 1, q.y + 1);
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.restore();
  }
  drawFairy();
  if (stillT > 0) drawStillness();
  if (state === "play" || state === "hit" || state === "pause" || state === "clear") drawHUD();
  drawBanner();
  if (state === "play" || state === "clear") { drawTip(); drawNet(); }
  if (hurtT > 0){
    const g = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.9);
    g.addColorStop(0, "rgba(255,40,70,0)"); g.addColorStop(1, `rgba(255,40,70,${0.45 * hurtT / 0.6})`);
    ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);
  }
  if (flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${flash*0.85})`;
    ctx.fillRect(-20,-20,W+40,H+40);
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.033) dt = 0.033;
  try {
    if (hitStop > 0){ hitStop = Math.max(0, hitStop - dt); draw(); }
    else { update(dt); draw(); }
    if (overlayOpen) tickLessonHint();
  }
  catch(err){ console.error("Mindwing frame error:", err); }   // one bad frame must not freeze the game
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
showTitle();
checkClass();
})();
</script>
</body>
</html>
