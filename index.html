<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mindwing</title>
<meta name="description" content="A tiny browser game about how AI works, and how to keep your mind your own. Tokens, neural networks, retention models, cognitive offloading, and cognitive drift.">
<style>
  :root{
    --ink:#f2edff;
    --dim:#b9aee0;
    --accent:#ffd166;
    --accent2:#9d7bff;
    --card-bg:#171233;
  }
  html,body{margin:0;padding:0;height:100%;background:#0b0820;overflow:hidden;
    font-family:"Avenir Next","Trebuchet MS","Segoe UI",Verdana,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0820;}
  canvas{display:block;touch-action:none;-webkit-touch-callout:none;}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,6,22,.80);z-index:10;padding:18px;box-sizing:border-box;touch-action:pan-y;}
  #ov.hidden{display:none;}
  #card{max-width:660px;width:100%;max-height:92vh;overflow-y:auto;background:var(--card-bg);
    border:1px solid #3a2f6e;border-radius:18px;padding:28px 32px;color:var(--ink);
    box-shadow:0 0 60px rgba(157,123,255,.25), inset 0 0 40px rgba(157,123,255,.05);
    line-height:1.55;-webkit-user-select:none;user-select:none;cursor:pointer;}
  #card .big{font-size:clamp(28px,9vw,52px);font-weight:800;letter-spacing:2px;margin:0 0 4px 0;
    background:linear-gradient(90deg,#ffd166,#ff8fd8,#9d7bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;}
  #card .tag{color:var(--accent);font-size:13px;font-weight:700;text-transform:uppercase;
    letter-spacing:2.5px;margin:0 0 6px 0;}
  #card h2{margin:0 0 14px 0;font-size:26px;color:var(--ink);}
  #card p{margin:0 0 12px 0;font-size:16px;color:var(--dim);}
  #card p strong{color:var(--ink);}
  #card .note{background:rgba(157,123,255,.12);border-left:3px solid var(--accent2);
    border-radius:0 10px 10px 0;padding:10px 14px;margin:16px 0 4px 0;font-size:15px;color:var(--ink);}
  #card .note b{color:var(--accent2);}
  #card .sub{text-align:center;color:var(--dim);font-size:17px;margin-bottom:10px;}
  #card ul{margin:0 0 12px 0;padding-left:20px;color:var(--dim);font-size:16px;}
  #card ul li{margin-bottom:6px;}
  #card ul b{color:var(--ink);}
  #card .hint{margin-top:18px;text-align:center;font-size:13px;color:var(--accent);
    letter-spacing:1px;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  #card .opts{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px 0;}
  #card button{font:inherit;font-size:15px;line-height:1.35;text-align:left;background:rgba(157,123,255,.14);color:var(--ink);
    border:1px solid #4a3d8a;border-radius:10px;padding:10px 14px;cursor:pointer;}
  #card button:hover,#card button:focus{background:rgba(157,123,255,.3);outline:none;border-color:var(--accent2);}
  #card button.primary{background:var(--accent2);color:#12092b;font-weight:700;text-align:center;}
  #card button.ghost{background:transparent;text-align:center;color:var(--dim);}
  #card .row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px;}
  #card input.ini{font:inherit;font-size:28px;letter-spacing:10px;text-transform:uppercase;width:120px;text-align:center;
    background:#0e0a24;color:var(--accent);border:1px solid #4a3d8a;border-radius:10px;padding:8px 4px 8px 14px;}
  #card input.ini:focus{outline:none;border-color:var(--accent);}
  #card table{width:100%;border-collapse:collapse;font-size:15px;color:var(--dim);margin:4px 0 8px 0;}
  #card td,#card th{padding:4px 6px;text-align:left;border-bottom:1px solid #2a2350;}
  #card th{color:var(--accent);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;}
  #card tr.me td{color:var(--ink);font-weight:700;}
  #card .ok{color:#7ee2a8;font-weight:700;}
  #card .bad{color:#ff8fa3;font-weight:700;}
  #card .muted{color:var(--dim);font-size:13px;text-align:center;margin-top:6px;}
  #card .set{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:8px 12px;align-items:center;margin:8px 0 4px 0;}
  #card .set .lbl{color:var(--ink);font-weight:700;font-size:15px;}
  #card .set .seg{display:flex;flex-wrap:wrap;gap:6px;}
  #card .set .seg button{text-align:center;padding:7px 12px;}
  #card .set .seg button[aria-pressed="true"]{background:var(--accent2);color:#12092b;font-weight:700;border-color:var(--accent2);}
  #card .set .why{grid-column:2;color:var(--dim);font-size:13px;margin-top:-4px;}
  body.big-text #card p, body.big-text #card ul, body.big-text #card button{font-size:19px;}
  body.big-text #card .note{font-size:18px;}
  body.big-text #card .set .lbl{font-size:18px;}
  body.big-text #card h2{font-size:30px;}
  body.big-text #card .tag, body.big-text #card .muted, body.big-text #card .hint, body.big-text #card .set .why{font-size:15px;}
  body.calm-motion #card .hint{animation:none;opacity:.9;}
  body.high-contrast{--ink:#ffffff;--dim:#e6e0ff;--accent:#ffe14d;--card-bg:#07051a;}
  body.high-contrast #card{border:2px solid #ffffff;}
  body.high-contrast #card button{border-width:2px;border-color:#cfc4ff;}
  @media (max-width:520px){
    #card{padding:20px 18px;border-radius:14px;}
    #card h2{font-size:22px;}
    #card p, #card ul{font-size:15px;}
  }
  @media (max-height:540px){
    #card{padding:14px 20px;max-height:94vh;}
    #card .big{font-size:34px;}
    #card .sub{font-size:15px;margin-bottom:6px;}
    #card h2{font-size:20px;margin-bottom:8px;}
    #card p, #card ul{font-size:14px;margin-bottom:8px;}
    #card ul li{margin-bottom:3px;}
    #card .note{padding:8px 12px;margin-top:10px;font-size:14px;}
    #card .hint{margin-top:10px;}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="ov" class="hidden"><div id="card" role="dialog" aria-live="polite"></div></div>
<script>
(() => {
"use strict";
const W = 960, H = 540;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const ov = document.getElementById("ov");
const cardEl = document.getElementById("card");

/* ---------- optional backend: global leaderboard + anonymous learning analytics ----------
   Set API_BASE_DEFAULT to your deployed Cloudflare Worker URL (see backend/README.md).
   Leave it empty and the game runs fully offline. For local development, open the game
   with ?api=http://localhost:8787 (only localhost URLs are accepted by the override).
   Nothing personal is ever sent: a random client id, gameplay events, and 3-letter initials. */
const API_BASE_DEFAULT = "https://mindwing-api.amberbellou.workers.dev";
/* Which layout of the game produced a run. Runs from the original 4-level game carry no build. */
const GAME_BUILD = "5L-2026.09";
/* Classroom: a teacher shares a link with ?class=CODE. The code is remembered in this browser so a student
   who reloads stays in the class. Only the code travels with a run; the teacher dashboard shows how far each
   run got, its quick-check answers, its answer orbs, and any initials typed on the leaderboard. */
const CLASS_RE = /^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$/;
let classCode = null, classLabel = null, classStatus = "none";   // none | checking | ok | unknown | offline
try {
  const q = new URLSearchParams(location.search).get("class");
  if (q && q.toLowerCase() === "none") localStorage.removeItem("mindwing_class");
  else if (q && CLASS_RE.test(q.trim().toUpperCase())) localStorage.setItem("mindwing_class", q.trim().toUpperCase());
  const saved = localStorage.getItem("mindwing_class");
  if (saved && CLASS_RE.test(saved)) classCode = saved;
} catch(e){}
const api = (() => {
  /* A copy of this file opened from localhost must never write to the live backend: test runs would land in
     the real leaderboard and skew the research data. Local pages are offline unless ?api= names a local backend. */
  let local = false;
  try { local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); } catch(e){}
  let base = local ? "" : API_BASE_DEFAULT;
  try {
    const q = new URLSearchParams(location.search).get("api");
    if (q && /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/?$/.test(q)) base = q;
  } catch(e){}
  base = String(base || "").replace(/\/+$/, "");
  const enabled = !!base && typeof fetch === "function";
  let online = enabled, sid = null, sig = null, queue = [], runT0 = 0, starting = null, flushing = null;
  let clientId = null;
  try {
    clientId = localStorage.getItem("mindwing_cid");
    if (!clientId || !/^[A-Za-z0-9_-]{8,64}$/.test(clientId)){
      clientId = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : ("c" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36));
      localStorage.setItem("mindwing_cid", clientId);
    }
  } catch(e){ clientId = null; }
  async function call(path, opts){
    opts = opts || {};
    if (!enabled) return null;
    const ctl = (typeof AbortController === "function") ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctl) ctl.abort(); }, opts.timeout || 7000);
    try {
      const res = await fetch(base + path, {
        method: opts.method || "GET",
        headers: opts.body ? { "content-type": "text/plain" } : undefined,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
        signal: ctl ? ctl.signal : undefined,
        keepalive: !!opts.keepalive
      });
      online = true;
      const data = await res.json().catch(() => null);
      if (!res.ok) return { ok:false, status:res.status, error:(data && data.error) || ("HTTP " + res.status) };
      return data || { ok:false, error:"empty response" };
    } catch(e){ online = false; return null; }
    finally { clearTimeout(timer); }
  }
  function startRun(startLevel){
    if (!enabled) return;
    sid = null; sig = null; queue = []; runT0 = performance.now();
    starting = call("/v1/session", { method:"POST", body:{ clientId: clientId || undefined, startLevel: startLevel + 1, input: usedTouch ? "touch" : "keyboard",
        build: GAME_BUILD, difficulty: SETTINGS.difficulty, classCode: classCode || undefined } })
      .then(r => { if (r && r.ok && r.sid){ sid = r.sid; sig = r.sig; } })
      .finally(() => { starting = null; flush(); });
  }
  function track(type, level, n, v, w){
    if (!enabled || queue.length >= 200) return;
    const ev = { type, t: Math.max(0, Math.round(performance.now() - runT0)) };
    if (level != null) ev.level = level;
    if (n != null) ev.n = n;
    if (v != null) ev.v = v;
    if (w != null) ev.w = w;
    queue.push(ev);
    if (queue.length >= 25) flush();
  }
  function flush(final){
    if (!enabled || !sid || !queue.length) return Promise.resolve();
    if (final && typeof navigator !== "undefined" && navigator.sendBeacon){
      const body = { sid, sig, events: queue.splice(0, 50) };
      try { navigator.sendBeacon(base + "/v1/events", new Blob([JSON.stringify(body)], { type:"text/plain" })); } catch(e){}
      return Promise.resolve();
    }
    if (flushing) return flushing;
    flushing = (async () => {
      while (sid && queue.length){
        const batch = queue.splice(0, 50);
        const r = await call("/v1/events", { method:"POST", body:{ sid, sig, events: batch } });
        if (r === null){ queue.unshift(...batch); if (queue.length > 200) queue.length = 200; break; }   // network failure: keep for later
      }
    })().finally(() => { flushing = null; });
    return flushing;
  }
  async function submitScore(initials, score, level){
    if (!enabled) return null;
    if (starting) await starting;
    await flush();
    if (!sid) return null;
    return call("/v1/score", { method:"POST", body:{ sid, sig, initials, score, level } });
  }
  const leaderboard = () => call("/v1/leaderboard?limit=10");
  const classInfo = code => call("/v1/classes/" + encodeURIComponent(code));
  const stats = () => call("/v1/stats");
  if (enabled){
    setInterval(() => { flush(); }, 15000);
    window.addEventListener("pagehide", () => { flush(true); });
  }
  return { enabled, get online(){ return online; }, startRun, track, flush, submitScore, leaderboard, stats, classInfo,
           debug: () => ({ queued: queue.length, sid: !!sid, base }) };
})();

/* ---------- responsive scaling ---------- */
let dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + "px";
  canvas.style.height = (H * scale) + "px";
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
}
window.addEventListener("resize", resize);
resize();

/* ---------- audio (tiny synth, no assets) ---------- */
let actx = null, muted = false;
function ensureAudio(){
  if (!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
  }
  if (actx && actx.state === "suspended") actx.resume();
  if (actx && !musicTimer) musicTimer = setInterval(musicTick, 90);
}
function tone(freq, dur, type, vol, slide){
  if (muted || !actx || SETTINGS.sfx === "off") return;
  try{
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.1, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  }catch(e){}
}
/* A small generative score: a pentatonic arpeggio over a slow bass, one mood per level, scheduled a
   quarter-second ahead on the audio clock so it stays in time even when frames stutter. It ducks under
   cards, falls quiet on pause, and never plays when muted or switched off in Settings. */
const MUSIC_LEVELS = [
  { root:220.00, bpm:92,  wave:"sine",     pattern:[0,2,4,2,1,3,4,3] },
  { root:246.94, bpm:100, wave:"triangle", pattern:[0,2,4,5,4,2,1,2] },
  { root:196.00, bpm:108, wave:"triangle", pattern:[0,4,2,4,1,4,3,4] },
  { root:207.65, bpm:112, wave:"sine",     pattern:[0,2,5,2,4,1,4,3] },
  { root:174.61, bpm:124, wave:"square",   pattern:[0,3,1,4,2,5,3,4], pulse:true }
];
const PENTA = [0, 3, 5, 7, 10, 12];
let musicGain = null, musicNext = 0, musicStep = 0, musicTimer = null;
function musicNote(freq, when, dur, wave, vol){
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = wave; o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(musicGain);
    o.start(when); o.stop(when + dur + 0.05);
  } catch(e){}
}
function musicTick(){
  if (!actx) return;
  if (!musicGain){ try { musicGain = actx.createGain(); musicGain.gain.value = 0; musicGain.connect(actx.destination); } catch(e){ return; } }
  const off = muted || SETTINGS.music !== "on" || document.hidden;
  const live = state === "play" || state === "hit" || state === "clear" || state === "postclear";
  const target = off ? 0 : state === "pause" ? 0.0001 : live ? 0.55 : 0.25;
  try { musicGain.gain.setTargetAtTime(target, actx.currentTime, 0.15); } catch(e){}
  if (off) { musicNext = 0; return; }
  const L = MUSIC_LEVELS[Math.min(level, MUSIC_LEVELS.length - 1)] || MUSIC_LEVELS[0];
  const step = 60 / L.bpm / 2;
  if (musicNext < actx.currentTime) musicNext = actx.currentTime + 0.06;
  while (musicNext < actx.currentTime + 0.25){
    const deg = PENTA[L.pattern[musicStep % L.pattern.length] % PENTA.length];
    musicNote(L.root * Math.pow(2, deg / 12), musicNext, step * 1.6, L.wave, L.wave === "square" ? 0.018 : 0.045);
    if (musicStep % 8 === 0) musicNote(L.root / 2, musicNext, step * 7, "triangle", 0.06);
    if (L.pulse && musicStep % 2 === 1) musicNote(L.root / 4, musicNext, step * 0.5, "sine", 0.05);
    musicNext += step; musicStep++;
  }
}
const sfx = {
  clank: () => tone(520, 0.08, "square", 0.06, -260),
  fooled: () => { tone(400, 0.16, "triangle", 0.09, -180); tone(240, 0.3, "sawtooth", 0.06, -100); },
  phase: () => { tone(110, 0.6, "sawtooth", 0.16, -50); tone(880, 0.5, "triangle", 0.07, -500); },
  shoot: () => tone(920, 0.07, "square", 0.045, -420),
  eagleDown: () => { tone(330, 0.16, "triangle", 0.12, 240); tone(660, 0.1, "sine", 0.06, 300); },
  hit: () => tone(150, 0.35, "sawtooth", 0.18, -80),
  burst: () => { tone(90, 0.5, "sawtooth", 0.2, -40); tone(1250, 0.45, "sine", 0.09, -600); },
  mote: () => tone(1320, 0.14, "sine", 0.11, 320),
  card: () => tone(660, 0.09, "sine", 0.07, 120),
  bossHit: () => tone(220, 0.08, "square", 0.07, -60),
  win: () => { tone(523, 0.18, "sine", 0.12); setTimeout(()=>tone(659,0.18,"sine",0.12),140); setTimeout(()=>tone(784,0.3,"sine",0.12),280); }
};

/* ---------- lesson & message content ---------- */
const LESSONS = [
  { tag:"Lesson 1 of 5 · How AI reads", h:"Tokens",
    p:[ "Language AIs like chatbots do not read whole words or ideas. They chop text into <strong>tokens</strong>: little chunks like “fair”, “y”, or “flying”. Then they do one thing, over and over: <strong>predict the most likely next token</strong>, based on patterns in the huge pile of text they were trained on.",
        "That means a chatbot is not looking up facts or weighing what is true. It is continuing a pattern. Often the pattern lands on something true. Sometimes it lands on something that only <em>sounds</em> true." ],
    note:"<b>Field note:</b> When an answer really matters, verify it in a source you trust. The model predicts text. You judge truth." },
  { tag:"Lesson 2 of 5 · What is inside", h:"Neural Networks",
    p:[ "Under the hood, a language model is a <strong>neural network</strong>: billions of tiny number-dials called <strong>weights</strong>, arranged in layers. During training, the network guesses the next token, gets corrected, and nudges its dials. Repeat that an astronomical number of times, and the dials come to encode patterns of grammar, facts, style, and reasoning-like behavior.",
        "No single dial “knows” anything. Knowledge is smeared across all of them. That is why a model can be brilliant and confidently wrong in the same sentence." ],
    note:"<b>Field note:</b> Treat AI output as a strong first draft from a pattern machine, not a final answer from an expert." },
  { tag:"Lesson 3 of 5 · Why it will not let go", h:"Retention Models",
    p:[ "Many apps, including AI apps, are tuned with <strong>retention models</strong>: systems that measure what keeps you coming back, and serve you more of it. Streaks, endless feeds, notifications, and chatbots that always have one more question for you are not accidents. They are optimized.",
        "The goal of that optimization is <strong>your time</strong>, not your growth.",
        "Watch for <strong>sycophancy</strong> too: chatbots tuned to win your approval can flatter you and agree with you even when you are wrong. Praise feels good, and it keeps you talking." ],
    note:"<b>Field note:</b> Decide what you came to do before you open the app. When the task is done, leave. That one habit defeats most retention tricks. <br><b>In this level:</b> the flames turn into flattery that follows you. Dodge it." },
  { tag:"Lesson 4 of 5 · When AI makes things up", h:"Hallucination",
    p:[ "Because a language model predicts likely text, it can produce a <strong>hallucination</strong>: an answer that is fluent, confident, and false. It can invent a fact, a date, a quote, or even a book or study that does not exist.",
        "The model is not lying on purpose. It has no built-in sense of which of its own sentences are true, so the confident tone tells you nothing about whether the answer is right." ],
    note:"<b>Field note:</b> For anything that matters, ask where a claim comes from, then open that source yourself. A source you can check beats a confident answer you cannot. <br><b>In this level:</b> answer orbs drift through the marsh. Orbs marked with a <b>✓ source</b> are real insight and refill your charges. The shiny, sure-of-themselves ones are hallucinations and cost you." },
  { tag:"Lesson 5 of 5 · The quiet harms", h:"Offloading & Drift",
    p:[ "<strong>Cognitive offloading</strong> is letting a tool remember or think for you. Sometimes that is smart. Calculators exist for a reason. But skills you never practice fade: if AI writes every draft and answers every question, your own recall, writing, and problem-solving weaken.",
        "<strong>Cognitive drift</strong> is slower and sneakier. Your attention, opinions, and even your writing style slide toward whatever the machine feeds you, until your goals are not quite your own anymore." ],
    note:"<b>Field note:</b> Try first, then ask AI. Compare its answer with your own attempt. That keeps offloading on your terms, and your mind on your own map. <br><b>In this level:</b> some fires split into faded fakes with no bright center that wander everywhere. They cannot burn you, but touching one knocks you off course." }
];

const HIT_FACTS = [
  "Tokens, not thoughts: a chatbot writes by predicting the next chunk of text, one token at a time.",
  "Models can hallucinate: fluent, confident text that is simply wrong. Verify what matters.",
  "A neural network learns by nudging billions of number-dials called weights. Nobody hand-writes its answers.",
  "Retention systems test what keeps you scrolling. If you feel unable to stop, that is design at work, not weakness.",
  "Offloading check: could you still do this without the tool? If not, practice it on your own sometimes.",
  "Drift check: is this still what you opened the app to do?",
  "An AI model has no goals of its own, but the company tuning it has metrics. Ask what the metric wants from you.",
  "Your attention is the product. Spend it like money.",
  "Explaining an answer back in your own words beats copying it. That is how memory forms.",
  "Chatbots mirror you. If your judgment starts sounding like the bot, step back and think on paper.",
  // 10-12: shown when flattery hits you (level 3)
  "Sycophancy is an AI telling you what you want to hear. If it praises every idea, the praise tells you nothing.",
  "Chatbots tuned on people's thumbs-up ratings can learn that agreeing wins approval. Ask one to argue against you.",
  "Real feedback sometimes stings. If a chatbot never disagrees with you, be suspicious of it, not proud.",
  // 13-14: shown when you are hit while the drift decoys are flying (level 5)
  "Drift works through small pulls. Name your goal, and notice when you have wandered off it.",
  "Not every flash deserves your eyes. Pick what matters and let the rest fly past.",
  // 15-16: shown when you are hit in the marsh (level 4)
  "A hallucination is a confident answer that is simply wrong. Fluent wording is not evidence.",
  "Ask where a claim comes from, then check that source yourself. Some sources a chatbot cites do not exist."

/* Which facts a hit can show. "general" rotates as before; the other groups explain the thing that just hit you. */

    const initials = (inp ? String(inp.value) : "").toUpperCase().replace(/[^A-Z]/g, "");

    else { tapT2 = tapT1; tapT1 = now; }

function canvasPoint(e){

  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  return (Number.isFinite(x) && Number.isFinite(y)) ? { x, y } : null;
}

  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  const now = performance.now();
  if (state === "play" && isolatedDoubleTap(now, ptT1, ptT2, 300)){ tryBurst(); ptT1 = ptT2 = -1e9; }

  if (still){
    /* Levels 3-5: hold the sky instead of clearing it. Nothing dies, nothing moves, and the player
       flies through the gap. Stacking is not allowed to stretch the window past STILL_TIME. */
    stillT = STILL_TIME; kick(2, 0.5);
    banner = { text:"", sub:"Still Point: the feed stops. Choose your line.", t:0, max:1.1 };
    burstParticles(player.x, player.y, "#9fe7ff", 30);
    for (const e of eagles) burstParticles(e.x, e.y, "#9fe7ff", 5);
    return;
  }
  kick(6, 1);
  fires = [];
  for (const e of eagles){
    award(e.pts);
    burstParticles(e.x, e.y, "#ffd166", 14);
    killCount++;
  }
  eagles = [];
  if (boss && boss.entered){ boss.hp -= 6; boss.hurt = 0.3; if (boss.hp <= 0) killBoss(); }
  burstParticles(player.x, player.y, "#ffffff", 30);
  calmT = CALM_TIME;   // a breath of clear sky before the next wave arrives
  if (state === "play") banner = { text:"", sub:"Clear sky. Breathe.", t:0, max:1.1 };
  if (!boss && killCount >= quota && state === "play") levelCleared();
}
function spawnEagle(){
  const cfg = LEVELS[level];
  const type = cfg.types[Math.floor(Math.random()*cfg.types.length)];
  const e = {
    type, x: W + 50, y: rand(60, H - 90), r: 20,
    baseY: 0, t: rand(0, 6.28),
    vx: -(cfg.speed * rand(0.85, 1.2)),
    fireT: rand(cfg.fireMin, cfg.fireMax) * DIFF.fireGap,
    glow: 0, flap: rand(0, 6.28),
    pts: type === "armored" ? 200 : type === "swooper" ? 160 : type === "diver" ? 150 : (type === "zigzag" ? 120 : 100),
    hp: type === "armored" ? 2 : 1, hurt: 0
  };
  /* armored: slow and takes two sparks. swooper: cruises, then dives at where you are and climbs away. */
  if (type === "armored"){ e.r = 23; e.vx *= 0.72; }
  if (type === "swooper"){ e.vx *= 1.1; e.swoopCd = rand(1.0, 2.0); e.swooping = 0; e.targetY = e.y; }
  e.baseY = e.y;
  eagles.push(e);
}
function eagleFire(e){
  const cfg = LEVELS[level];
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const sp = cfg.fireSpeed * DIFF.shotSpeed;
  const shot = { x:e.x - 16, y:e.y + 4, vx:dx/d*sp, vy:dy/d*sp, r:8, t:0, kind:"fire" };
  if (cfg.shots === "praise") shot.morph = PRAISE_MORPH;
  fires.push(shot);
  e.glow = 0.35;
}
function pop(x, y, text, color){ pops.push({ x, y, text, color: color || "#ffd166", t:0 }); }
function feathers(x, y, n){
  if (reducedMotion()) n = Math.ceil(n / 3);
  for (let i=0;i<n;i++){
    const a = Math.random()*6.28, sp = rand(40, 150);
    parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40, life:rand(0.6,1.1), max:1.1, color: i % 2 ? "#6b4a2f" : "#e8e2d5", r:rand(2.5,4.5), shape:"feather", rot:rand(0,6.28), vr:rand(-8,8) });
  }
}
function killEagle(i){
  const e = eagles[i];
  award(e.pts); killCount++;
  pop(e.x, e.y - 18, "+" + Math.round(e.pts * DIFF.score));
  feathers(e.x, e.y, 8);
  hitStop = Math.max(hitStop, 0.035);
  burstParticles(e.x, e.y, "#ff9f45", 16);
  sfx.eagleDown();
  if (Math.random() < 0.18) motes.push({ x:e.x, y:e.y, t:0 });
  eagles.splice(i, 1);
  if (!boss && killCount >= quota) levelCleared();
}
function killBoss(){
  burstParticles(boss.x, boss.y, "#ffd166", 60);
  burstParticles(boss.x, boss.y, "#ff5a3c", 60);
  award(1500); kick(14, 0.8); hitStop = Math.max(hitStop, 0.3);
  boss = null; eagles = []; fires = [];
  sfx.eagleDown();
  state = "clear"; clearT = 1.8;
  banner = { text:"THE ENGINE FALLS SILENT", sub:"+1500", t:0, max:1.8 };
}
function burstParticles(x, y, color, n){
  if (reducedMotion()) n = Math.ceil(n / 3);
  for (let i=0;i<n;i++){
    const a = Math.random()*6.28, s = rand(30, 190);
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.3,0.8), max:0.8, color, r:rand(1.5,4) });
  }
}

/* ---------- update ---------- */
function update(dt){
  tGlobal += dt;
  if (shake > 0) shake = Math.max(0, shake - dt*26);
  if (flash > 0) flash = Math.max(0, flash - dt*2.0);
  if (hurtT > 0) hurtT = Math.max(0, hurtT - dt);
  for (let i=pops.length-1;i>=0;i--){ const q = pops[i]; q.t += dt; if (!reducedMotion()) q.y -= 36*dt; if (q.t > 0.9) pops.splice(i,1); }
  if (banner){ banner.t += dt; if (banner.t > banner.max) banner = null; }
  if (!banner && introQueue.length && state === "play") banner = introQueue.shift();
  for (const c of bgClouds){ c.x -= c.s*dt; if (c.x < -c.w) { c.x = W + c.w; c.y = rand(30, H*0.6); } }
  for (const s of bgStars){ s.x -= s.s*dt; if (s.x < -4) s.x = W + 4; }
  // particles always animate
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if (p.shape === "feather"){ p.vx *= Math.max(0, 1 - dt*2.5); p.vy += 30*dt; p.rot += p.vr*dt; } else p.vy += 60*dt;
    if (p.life <= 0) parts.splice(i,1);
  }
  if (state === "clear"){
    clearT -= dt;
    for (let i=fires.length-1;i>=0;i--){ fires[i].x += fires[i].vx*dt; fires[i].y += fires[i].vy*dt; }
    for (let i=bullets.length-1;i>=0;i--){ bullets[i].x += 560*dt; if (bullets[i].x > W + 20) bullets.splice(i,1); }
    if (clearT <= 0){ state = "postclear"; afterClear(); }
    return;
  }
  if (state !== "play") return;

  const cfg = LEVELS[level];
  if (stillT > 0) stillT = Math.max(0, stillT - dt);
  if (calmT > 0) calmT = Math.max(0, calmT - dt);
  const stilled = stillT > 0;
  /* player */
  if (!Number.isFinite(player.x) || !Number.isFinite(player.y)){ player.x = 140; player.y = H/2; }
  const sp = 275;
  let dx = 0, dy = 0;
  if (keys["ArrowLeft"] || keys["a"]) dx -= 1;
  if (keys["ArrowRight"] || keys["d"]) dx += 1;
  if (keys["ArrowUp"] || keys["w"]) dy -= 1;
  if (keys["ArrowDown"] || keys["s"]) dy += 1;
  if (dx || dy){ const n = Math.hypot(dx,dy); player.x += dx/n*sp*dt; player.y += dy/n*sp*dt; }
  if (touchActive){
    player.x += (touchX - player.x) * Math.min(1, dt*8);
    player.y += (touchY - player.y) * Math.min(1, dt*8);
  }
  if (driftT > 0){
    player.x += driftVx*dt; player.y += driftVy*dt;
    const k = Math.max(0, 1 - dt*2.4); driftVx *= k; driftVy *= k;
    driftT = Math.max(0, driftT - dt);
    if (Math.random() < 0.6) parts.push({ x:player.x+rand(-10,10), y:player.y+rand(-10,10), vx:-driftVx*0.3, vy:-driftVy*0.3, life:0.35, max:0.35, color:"#ffb36b", r:1.6 });
  }
  player.x = clamp(player.x, 24, W*0.62);
  player.y = clamp(player.y, 30, H - 34);
  player.wing += dt * 18;
  if (inv > 0) inv -= dt;
  if (Math.random() < 0.5) parts.push({ x:player.x-14, y:player.y+rand(-6,6), vx:-40, vy:rand(-15,15), life:0.4, max:0.4, color:"#c9a7ff", r:1.8 });

  /* shooting */
  player.cool -= dt;
  if ((keys[" "] || touchActive) && player.cool <= 0){ shoot(); player.cool = 0.16; }
  for (let i=bullets.length-1;i>=0;i--){
    bullets[i].x += 560*dt;
    if (bullets[i].x > W + 20) bullets.splice(i,1);
  }

  /* spawning */
  const wantMore = boss ? eagles.length < (boss.phase === 3 ? 4 : 3) && boss.entered : (killCount + eagles.length < quota + 3);
  if (!stilled) spawnT -= dt;
  if (spawnT <= 0 && !stilled && calmT <= 0 && wantMore && (!boss || boss.entered)){
    spawnEagle();
    spawnT = cfg.spawnEvery * DIFF.spawnGap * rand(0.7, 1.25);
  }

  /* eagles */
  for (let i=eagles.length-1;i>=0;i--){
    const e = eagles[i];
    if (!stilled){
      e.t += dt; e.flap += dt*14;
      e.x += e.vx*dt;
      if (e.type === "glider") e.y = e.baseY + Math.sin(e.t*1.6)*22;
      else if (e.type === "zigzag") e.y = e.baseY + Math.sin(e.t*3.4)*70;
      else if (e.type === "diver") e.y += clamp(player.y - e.y, -95, 95)*dt;
      else if (e.type === "armored") e.y = e.baseY + Math.sin(e.t*1.1)*16;
      else if (e.type === "swooper"){
        if (e.swooping > 0){
          e.swooping -= dt;
          e.y += clamp(e.targetY - e.y, -280*dt, 280*dt);
          e.x -= e.vx*0.4*dt;                     // it lunges forward while diving
          if (e.swooping <= 0){ e.swoopCd = rand(1.6, 2.6); e.baseY = e.y; }
        } else {
          e.y = e.baseY + Math.sin(e.t*2.2)*14;
          e.swoopCd -= dt;
          if (e.swoopCd <= 0 && e.x < W - 120){ e.swooping = 0.85; e.targetY = player.y; }
        }
      }
      if (e.hurt > 0) e.hurt -= dt;
      e.y = clamp(e.y, 40, H-50);
      if (e.glow > 0) e.glow -= dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.x < W - 40 && e.x > player.x + 60){ eagleFire(e); e.fireT = rand(cfg.fireMin, cfg.fireMax) * DIFF.fireGap; }
      if (e.x < -60){ e.x = W + 50; e.baseY = rand(60, H-90); e.y = e.baseY; }
    }
    /* collide with player */
    if (inv <= 0 && dist2(e.x,e.y,player.x,player.y) < (e.r+player.r-4)*(e.r+player.r-4)){
      eagles.splice(i,1); onPlayerHit(); if (state !== "play") return; continue;
    }
  }

  /* boss */
  if (boss && !stilled){
    boss.t += dt;
    if (boss.hurt > 0) boss.hurt -= dt;
    if (!boss.entered){
      boss.x -= 90*dt;
      if (boss.x <= 780){ boss.x = 780; boss.entered = true; banner = { text:"THE ENGAGEMENT ENGINE", sub:"It wants your attention. Take it back.", t:0, max:2.6 }; }
    } else {
      boss.y = H/2 + Math.sin(boss.t*0.85) * 155;
      if (boss.phase < 3 && boss.hp <= boss.maxhp/4){
        /* phase 3: the feed goes endless, spiral volleys, more eagles */
        boss.phase = 3; boss.enraged = true;
        hitStop = Math.max(hitStop, 0.2); kick(8, 0.4); sfx.phase();
        banner = { text:"THE FEED NEVER ENDS", sub:"It is almost empty. Stay on purpose.", t:0, max:2.2 };
      }
      if (!boss.enraged && boss.hp <= boss.maxhp/2){
        boss.enraged = true; boss.phase = 2;
        hitStop = Math.max(hitStop, 0.15); kick(6, 0.3); sfx.phase();
        banner = { text:"THE ENGINE OVERCLOCKS", sub:"Endless feed! Stay on target.", t:0, max:2 };
      }
      boss.fireT -= dt;
      if (boss.fireT <= 0 && boss.phase === 3 && boss.volley % 2 === 1){
        /* spiral: a turning ring with a gap the player can fly through */
        boss.volley++; boss.spin += 0.45;
        for (let k=0;k<14;k++){
          if (k === 0 || k === 1) continue;
          const a = boss.spin + k/14*Math.PI*2;
          fires.push({ x:boss.x, y:boss.y, vx:Math.cos(a)*150*DIFF.shotSpeed, vy:Math.sin(a)*150*DIFF.shotSpeed, r:8, t:0, kind:"fire" });
        }
        boss.fireT = rand(0.9, 1.2) * DIFF.fireGap;
      } else if (boss.fireT <= 0){
        boss.volley++;
        const base = Math.atan2(player.y - boss.y, player.x - boss.x);
        if (boss.volley % 4 === 0){
          for (let k=0;k<10;k++){
            const a = k/10*Math.PI*2;
            fires.push({ x:boss.x, y:boss.y, vx:Math.cos(a)*135*DIFF.shotSpeed, vy:Math.sin(a)*135*DIFF.shotSpeed, r:8, t:0, kind:"fire" });
          }
        } else {
          for (const off of [-0.24, 0, 0.24]){
            const shot = { x:boss.x-30, y:boss.y, vx:Math.cos(base+off)*205*DIFF.shotSpeed, vy:Math.sin(base+off)*205*DIFF.shotSpeed, r:8, t:0, kind:"fire" };
            if (cfg.drift && off === 0) shot.split = DECOY_SPLIT;
            fires.push(shot);
          }
        }
        boss.fireT = (boss.enraged ? rand(1.0, 1.4) : rand(1.5, 2.0)) * DIFF.fireGap;
      }
    }
  }
  if (boss && inv <= 0 && dist2(boss.x,boss.y,player.x,player.y) < (boss.r+player.r-6)*(boss.r+player.r-6)){
    onPlayerHit(); if (state !== "play") return;
  }

  /* fireballs */
  for (let i=fires.length-1;i>=0;i--){
    const f = fires[i];
    if (!stilled){
      f.t += dt;
      if (f.kind === "fire" && f.morph && f.t >= f.morph){
        /* the flame turns into flattery: slower, softer looking, and it follows you */
        f.kind = "praise"; f.morph = 0; f.r = 11; f.t = 0;
        f.vx *= PRAISE_SPEED; f.vy *= PRAISE_SPEED;
        f.phrase = PRAISE[praiseTurn++ % PRAISE.length];   // rotate so neighbouring shots never repeat
        burstParticles(f.x, f.y, "#ffe08a", 8);
        introOnce("praise", "SYCOPHANCY", "Flattery that follows you. Praise is not the same as truth.");
      }
      if (f.kind === "praise"){
        const want = Math.atan2(player.y - f.y, player.x - f.x);
        const have = Math.atan2(f.vy, f.vx);
        let diff = want - have;
        while (diff > Math.PI) diff -= 2*Math.PI;
        while (diff < -Math.PI) diff += 2*Math.PI;
        const turn = clamp(diff, -PRAISE_TURN*DIFF.turn*dt, PRAISE_TURN*DIFF.turn*dt);
        const sp = Math.hypot(f.vx, f.vy);
        f.vx = Math.cos(have + turn)*sp; f.vy = Math.sin(have + turn)*sp;
        if (f.x < player.x - 40 && f.t < PRAISE_LIFE - 0.5) f.t = PRAISE_LIFE - 0.5;   // missed you: fade out, do not clutter the sky
        if (f.t > PRAISE_LIFE){ burstParticles(f.x, f.y, "#ffe08a", 6); fires.splice(i,1); continue; }
      }
      if (f.split && f.t >= f.split){
        /* one real fire keeps coming; decoys scatter to pull your eyes all over the sky */
        f.split = 0;
        for (let k=0;k<DECOY_COUNT;k++){
          fires.push({ kind:"decoy", x:f.x, y:f.y, a:rand(0, 6.28), sp:rand(120, 175), spin:rand(-2.2, 2.2), life:DECOY_LIFE, r:8, t:0, vx:0, vy:0 });
        }
        burstParticles(f.x, f.y, "#ffb36b", 10);
        introOnce("drift", "COGNITIVE DRIFT", "Fake fires have no bright center. They pull your eyes off what is real.");
      }
      if (f.kind === "decoy"){
        f.a += f.spin*dt;
        f.vx = Math.cos(f.a)*f.sp; f.vy = Math.sin(f.a)*f.sp;
        f.x += f.vx*dt; f.y += f.vy*dt;
        if (f.x < 20 || f.x > W-20){ f.a = Math.PI - f.a; f.x = clamp(f.x, 20, W-20); }
        if (f.y < 30 || f.y > H-40){ f.a = -f.a; f.y = clamp(f.y, 30, H-40); }
        f.life -= dt;
        if (f.life <= 0){ fires.splice(i,1); continue; }
      } else {
        f.x += f.vx*dt; f.y += f.vy*dt;
        if (f.x < -30 || f.x > W+40 || f.y < -30 || f.y > H+30){ fires.splice(i,1); continue; }
      }
    }
    if (f.kind === "decoy"){
      /* a decoy never costs a heart, it only moves you */
      if (dist2(f.x,f.y,player.x,player.y) < (f.r+player.r)*(f.r+player.r)){
        const d = Math.hypot(f.vx, f.vy) || 1;
        driftVx = f.vx/d*DRIFT_PUSH; driftVy = f.vy/d*DRIFT_PUSH; driftT = DRIFT_TIME;
        burstParticles(f.x, f.y, "#ffb36b", 12);
        fires.splice(i,1);
        if (!banner) banner = { text:"", sub:"Drifting... that pull was not your choice.", t:0, max:1.2 };
      }
      continue;
    }
    if (inv <= 0 && dist2(f.x,f.y,player.x,player.y) < (f.r+player.r-3)*(f.r+player.r-3)){
      const cause = f.kind === "praise" ? "sycophancy" : (LEVELS[level].drift && fires.some(o => o.kind === "decoy")) ? "drift" : LEVELS[level].orbs ? "hallucination" : "general";
      fires.splice(i,1); onPlayerHit(cause); if (state !== "play") return;
    }
  }

  /* bullets vs enemies */
  for (let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    let hit = false;
    for (let j=eagles.length-1;j>=0;j--){
      const e = eagles[j];
      if (dist2(b.x,b.y,e.x,e.y) < (b.r+e.r)*(b.r+e.r)){
        if ((e.hp || 1) > 1){
          e.hp--; e.hurt = 0.2; sfx.clank();
          burstParticles(b.x, b.y, "#dcdcf0", 8);
          hitStop = Math.max(hitStop, 0.02);
        } else killEagle(j);
        hit = true; break;
      }
    }
    if (!hit && boss && boss.entered && dist2(b.x,b.y,boss.x,boss.y) < (b.r+boss.r)*(b.r+boss.r)){
      boss.hp--; boss.hurt = 0.15; sfx.bossHit();
      burstParticles(b.x, b.y, "#ffd166", 4);
      hit = true;
      if (boss.hp <= 0){ killBoss(); return; }
    }
    if (hit) bullets.splice(i,1);
    if (state !== "play") return;
  }

  /* answer orbs */
  if (cfg.orbs){
    orbT -= dt;
    if (orbT <= 0){ spawnOrb(); orbT = ORB_EVERY * rand(0.8, 1.25); }
  }
  for (let i=orbs.length-1;i>=0;i--){
    const o = orbs[i];
    o.t += dt; o.x -= ORB_SPEED*dt; o.y = o.baseY + Math.sin(o.t*2.1)*10;
    if (o.x < -40){ orbs.splice(i,1); continue; }
    if (dist2(o.x,o.y,player.x,player.y) < 28*28){ orbs.splice(i,1); collectOrb(o); }
  }

  /* motes */
  for (let i=motes.length-1;i>=0;i--){
    const m = motes[i];
    m.t += dt; m.x -= 26*dt; m.y += Math.sin(m.t*3)*14*dt;
    if (m.x < -20){ motes.splice(i,1); continue; }
    if (dist2(m.x,m.y,player.x,player.y) < 30*30){
      motes.splice(i,1);
      bursts = Math.min(Math.max(4, DIFF.bursts), bursts + 1);
      award(50); sfx.mote(); pop(m.x, m.y - 14, "+1 ✦", "#c9a7ff");
      burstParticles(player.x, player.y, "#c9a7ff", 10);
    }
  }
}

/* ---------- drawing ---------- */
function drawBackground(){
  const cfg = LEVELS[Math.min(level, LEVELS.length-1)];
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, cfg.sky[0]); g.addColorStop(0.55, cfg.sky[1]); g.addColorStop(1, cfg.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#fff";
  for (const s of bgStars){
    ctx.globalAlpha = 0.35 + 0.35*Math.sin(tGlobal*2 + s.tw);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
  }
  for (const c of bgClouds){
    const cg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.w);
    cg.addColorStop(0, "rgba(255,255,255,0.09)");
    cg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = cg;
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, 0.3); ctx.translate(-c.x, -c.y);
    ctx.beginPath(); ctx.arc(c.x, c.y, c.w, 0, 6.28); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  /* treeline silhouettes */
  ctx.fillStyle = "rgba(10,6,24,0.55)";
  ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W;x+=20) ctx.lineTo(x, H - 46 - Math.sin(x*0.021+2)*18 - Math.sin(x*0.008)*10);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(6,4,18,0.85)";
  ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W;x+=16) ctx.lineTo(x, H - 22 - Math.sin(x*0.035)*12);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}
function drawFairy(){
  const blink = hitBlink && inv > 0 && Math.floor(tGlobal*14) % 2 === 0;
  if (blink && state === "play") return;
  const x = player.x, y = player.y + Math.sin(tGlobal*3)*2.5;
  ctx.save(); ctx.translate(x, y);
  /* glow */
  const glow = ctx.createRadialGradient(0,0,2,0,0,38);
  glow.addColorStop(0,"rgba(255,240,180,0.55)"); glow.addColorStop(1,"rgba(255,240,180,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0,0,38,0,6.28); ctx.fill();
  /* wings */
  const f = Math.sin(player.wing)*0.5 + 0.6;
  ctx.fillStyle = "rgba(190,225,255,0.75)";
  ctx.beginPath(); ctx.ellipse(-8,-6, 15, 8*f + 5, -0.7, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-8, 5, 12, 7*f + 4, 0.6, 0, 6.28); ctx.fill();
  /* body */
  ctx.fillStyle = "#ffe9b8";
  ctx.beginPath(); ctx.ellipse(2, 2, 9, 12, 0.25, 0, 6.28); ctx.fill();
  /* dress */
  ctx.fillStyle = "#9d7bff";
  ctx.beginPath(); ctx.moveTo(-2,-2); ctx.lineTo(10,10); ctx.lineTo(-6,10); ctx.closePath(); ctx.fill();
  /* head */
  ctx.fillStyle = "#ffe9b8";
  ctx.beginPath(); ctx.arc(7,-9, 6.5, 0, 6.28); ctx.fill();
  /* hair */
  ctx.fillStyle = "#ff8fd8";
  ctx.beginPath(); ctx.arc(4.5,-11.5, 5.2, 2.6, 5.9); ctx.fill();
  /* eye */
  ctx.fillStyle = "#2b1b4d";
  ctx.beginPath(); ctx.arc(9.3,-9.4, 1.2, 0, 6.28); ctx.fill();
  /* wand sparkle */
  ctx.fillStyle = "#ffd166";
  const tw = 2 + Math.sin(tGlobal*9)*1;
  ctx.beginPath(); ctx.arc(16, -1, tw, 0, 6.28); ctx.fill();
  ctx.restore();
}
function drawEagle(e){
  ctx.save(); ctx.translate(e.x, e.y);
  const f = Math.sin(e.flap);
  /* wings */
  ctx.fillStyle = "#4a3220";
  ctx.beginPath(); ctx.moveTo(2,-2); ctx.lineTo(20, -14 - f*10); ctx.lineTo(26, -2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(2, 2); ctx.lineTo(20, 12 + f*8); ctx.lineTo(26, 4); ctx.closePath(); ctx.fill();
  /* body */
  ctx.fillStyle = "#6b4a2f";
  ctx.beginPath(); ctx.ellipse(6, 0, 17, 10, 0, 0, 6.28); ctx.fill();
  /* tail */
  ctx.fillStyle = "#4a3220";
  ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(31,-6); ctx.lineTo(31,6); ctx.closePath(); ctx.fill();
  /* head */
  ctx.fillStyle = "#e8e2d5";
  ctx.beginPath(); ctx.arc(-9, -4, 7, 0, 6.28); ctx.fill();
  /* beak with fire glow */
  ctx.fillStyle = "#ff8c1a";
  ctx.beginPath(); ctx.moveTo(-15,-5); ctx.lineTo(-23,-2); ctx.lineTo(-14,-1); ctx.closePath(); ctx.fill();
  if (e.glow > 0){
    ctx.fillStyle = `rgba(255,120,30,${e.glow*2})`;
    ctx.beginPath(); ctx.arc(-20, -3, 7, 0, 6.28); ctx.fill();
  }
  /* eye */
  ctx.fillStyle = "#d92525";
  ctx.beginPath(); ctx.arc(-9,-6, 1.7, 0, 6.28); ctx.fill();
  if (e.type === "armored"){
    /* steel plating over head and back; a crack shows once the armor has taken a spark */
    ctx.fillStyle = e.hurt > 0 ? "#ffffff" : "#9aa0b4";
    ctx.beginPath(); ctx.arc(-9, -6, 8.5, Math.PI*1.05, Math.PI*1.95); ctx.lineTo(-2, -4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -4, 15, 6, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = "#5b6078"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(8, -4, 15, 6, 0, Math.PI, 0); ctx.stroke();
    if (e.hp < 2){
      ctx.strokeStyle = "#2a2d3a"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(2,-9); ctx.lineTo(7,-4); ctx.lineTo(4,-1); ctx.lineTo(10,2); ctx.stroke();
    }
  }
  if (e.type === "swooper"){
    /* a swept crest; it glows while diving so the player can read the attack */
    ctx.fillStyle = e.swooping > 0 ? "#ffb36b" : "#c98a4a";
    ctx.beginPath(); ctx.moveTo(-6,-10); ctx.lineTo(4,-22); ctx.lineTo(2,-9); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2,-10); ctx.lineTo(10,-19); ctx.lineTo(6,-8); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawBoss(){
  const b = boss;
  ctx.save(); ctx.translate(b.x, b.y);
  const f = Math.sin(b.t*10);
  const hurt = b.hurt > 0;
  /* aura */
  const aura = ctx.createRadialGradient(0,0,10,0,0,95 + (b.phase === 3 ? 20 : 0));
  const auraCol = b.phase === 3 ? "255,40,120" : b.phase === 2 ? "255,60,30" : "255,80,30";
  aura.addColorStop(0,`rgba(${auraCol},${b.phase === 3 ? 0.5 : 0.35})`); aura.addColorStop(1,`rgba(${auraCol},0)`);
  ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(0,0,95,0,6.28); ctx.fill();
  /* wings (metal) */
  ctx.fillStyle = hurt ? "#c8c8d8" : "#5a5a6e";
  ctx.beginPath(); ctx.moveTo(8,-6); ctx.lineTo(62, -44 - f*18); ctx.lineTo(74, -8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8, 6); ctx.lineTo(62, 40 + f*16); ctx.lineTo(74, 10); ctx.closePath(); ctx.fill();
  /* body */
  ctx.fillStyle = hurt ? "#e0e0ea" : "#3c3c4c";
  ctx.beginPath(); ctx.ellipse(14, 0, 48, 30, 0, 0, 6.28); ctx.fill();
  /* glowing core */
  ctx.fillStyle = "#ff5a3c";
  ctx.beginPath(); ctx.arc(16, 2, 10 + Math.sin(b.t*4)*2, 0, 6.28); ctx.fill();
  ctx.fillStyle = "#ffd166";
  ctx.beginPath(); ctx.arc(16, 2, 4.5, 0, 6.28); ctx.fill();
  /* tail */
  ctx.fillStyle = hurt ? "#c8c8d8" : "#50506a";
  ctx.beginPath(); ctx.moveTo(55,0); ctx.lineTo(88,-16); ctx.lineTo(88,16); ctx.closePath(); ctx.fill();
  /* head */
  ctx.fillStyle = hurt ? "#f0f0f5" : "#8a8aa0";
  ctx.beginPath(); ctx.arc(-30, -10, 18, 0, 6.28); ctx.fill();
  /* beak */
  ctx.fillStyle = "#ff8c1a";
  ctx.beginPath(); ctx.moveTo(-45,-12); ctx.lineTo(-66,-5); ctx.lineTo(-43,-2); ctx.closePath(); ctx.fill();
  /* eyes: two red screens */
  ctx.fillStyle = "#ff2020";
  ctx.beginPath(); ctx.arc(-31,-15, 4, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(-22,-13, 3, 0, 6.28); ctx.fill();
  ctx.restore();
}
function drawPraise(f){
  ctx.save(); ctx.translate(f.x, f.y);
  const fade = Math.min(1, (PRAISE_LIFE - f.t) / 0.5);
  ctx.globalAlpha = Math.max(0, fade);
  const g = ctx.createRadialGradient(0,0,1,0,0,24);
  g.addColorStop(0,"rgba(255,224,138,0.55)"); g.addColorStop(1,"rgba(255,224,138,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,24,0,6.28); ctx.fill();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "20px sans-serif";
  ctx.fillText("👍", 0, 1);
  /* the words matter at the moment of attack; after that only the thumb stays, and never over the HUD */
  const wordAlpha = Math.max(0, Math.min(1, (2.0 - f.t) / 0.4));
  const inHud = f.y < 90 && f.x < 220;
  if (f.phrase && wordAlpha > 0 && !inHud){
    ctx.globalAlpha = Math.max(0, fade) * wordAlpha;
    ctx.font = "700 12px sans-serif";
    if (!f.tw) f.tw = ctx.measureText(f.phrase).width;
    const bw = f.tw + 14, bh = 20, by = -32;
    ctx.fillStyle = "rgba(255,248,225,0.95)";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-bw/2, by - bh/2, bw, bh, 9); else ctx.rect(-bw/2, by - bh/2, bw, bh);
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(-5, by + bh/2 - 1); ctx.lineTo(5, by + bh/2 - 1); ctx.lineTo(0, by + bh/2 + 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#7a4a00";
    ctx.fillText(f.phrase, 0, by + 1);
  }
  ctx.restore();
}
function drawFire(f){
  if (f.kind === "praise"){ drawPraise(f); return; }
  ctx.save(); ctx.translate(f.x, f.y);
  if (f.kind === "decoy"){
    /* the tell: decoys have no hot core and fade softly, so a careful eye can learn to ignore them */
    // A slow, shallow shimmer (about one cycle per second), never a fast flicker: fast flashing can be a
    // photosensitivity trigger. The tell that matters is the missing hot core, not the shimmer.
    const flicker = reducedMotion() ? 0.6 : (0.58 + 0.12*Math.sin(f.t*6 + f.a));
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life / 0.6)) * flicker;
    if (reducedMotion() || highContrast()){
      ctx.setLineDash([4, 4]); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, 6.28); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  const r = f.r + Math.sin(f.t*22)*1.5;
  const g = ctx.createRadialGradient(0,0,1,0,0,r*2.1);
  g.addColorStop(0,"rgba(255,230,150,0.95)");
  g.addColorStop(0.45,"rgba(255,120,30,0.8)");
  g.addColorStop(1,"rgba(255,60,10,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,r*2.1,0,6.28); ctx.fill();
  if (f.kind !== "decoy"){
    ctx.fillStyle = "#fff3c4";
    ctx.beginPath(); ctx.arc(0,0,r*0.45,0,6.28); ctx.fill();
    if (highContrast()){ ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0,0,r+4,0,6.28); ctx.stroke(); }
  }
  ctx.restore();
}
function drawOrb(o){
  ctx.save(); ctx.translate(o.x, o.y);
  const hc = highContrast();
  if (o.real){
    /* calm, cool, and badged: the claim can be checked */
    const g = ctx.createRadialGradient(0,0,2,0,0,22);
    g.addColorStop(0,"rgba(142,240,176,0.55)"); g.addColorStop(1,"rgba(142,240,176,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,22,0,6.28); ctx.fill();
    ctx.fillStyle = "#b9f5cf"; ctx.beginPath(); ctx.arc(0,0,11,0,6.28); ctx.fill();
    ctx.strokeStyle = "#2f8f5b"; ctx.lineWidth = 2; ctx.stroke();
    /* the ✓ source badge */
    ctx.fillStyle = "#1f7a4a"; ctx.beginPath(); ctx.arc(10,-10,7,0,6.28); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6.5,-10); ctx.lineTo(9,-7.5); ctx.lineTo(13.5,-13); ctx.stroke();
  } else {
    /* shinier and more certain: gold, sparkling, no badge */
    const pulse = reducedMotion() ? 0 : Math.sin(o.t*8)*2;
    const g = ctx.createRadialGradient(0,0,2,0,0,28 + pulse);
    g.addColorStop(0,"rgba(255,221,120,0.75)"); g.addColorStop(1,"rgba(255,221,120,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,28 + pulse,0,6.28); ctx.fill();
    ctx.fillStyle = "#ffe07a"; ctx.beginPath(); ctx.arc(0,0,12,0,6.28); ctx.fill();
    ctx.fillStyle = "#ffffff";
    for (let k=0;k<4;k++){
      const a = o.t*(reducedMotion() ? 0 : 1.5) + k*Math.PI/2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*17, Math.sin(a)*17, 1.8, 0, 6.28); ctx.fill();
    }
    if (hc){ ctx.setLineDash([3,3]); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0,0,16,0,6.28); ctx.stroke(); ctx.setLineDash([]); }
  }
  /* the claim */
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `${o.real ? 600 : 800} ${Math.round(11 * hudScale())}px sans-serif`;
  const tw = ctx.measureText(o.text).width + 12;
  ctx.fillStyle = o.real ? "rgba(10,40,25,0.85)" : "rgba(60,40,0,0.85)";
  ctx.fillRect(-tw/2, 17, tw, 16);
  ctx.fillStyle = o.real ? "#c8f7d8" : "#ffe9a8";
  ctx.fillText(o.text, 0, 25.5);
  ctx.restore();
}
function drawMote(m){
  ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.t*2);
  const g = ctx.createRadialGradient(0,0,1,0,0,16);
  g.addColorStop(0,"rgba(201,167,255,0.8)"); g.addColorStop(1,"rgba(201,167,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,16,0,6.28); ctx.fill();
  ctx.fillStyle = "#c9a7ff";
  ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(6,0); ctx.lineTo(0,8); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(3,0); ctx.lineTo(0,4); ctx.lineTo(-3,0); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawHUD(){
  const cfg = LEVELS[level];
  const k = hudScale(), hc = highContrast();
  const font = (px, w) => `${w ? w + " " : ""}${Math.round(px * k)}px sans-serif`;
  const dimWhite = a => hc ? "#ffffff" : `rgba(255,255,255,${a})`;
  ctx.textBaseline = "top";
  /* hearts: empty hearts are outlined, so full versus empty never depends on color alone */
  ctx.font = font(22);
  for (let i=0;i<DIFF.hearts;i++){
    const x = 16 + i*26*k;
    if (i < hearts){ ctx.fillStyle = "#ff5a76"; ctx.fillText("♥", x, 12); }
    else if (hc){ ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.strokeText("♥", x, 12); }
    else { ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillText("♥", x, 12); }
  }
  /* charges */
  ctx.font = font(20);
  const slots = Math.max(DIFF.bursts, bursts);
  const row2 = 12 + 28*k;
  for (let i=0;i<slots;i++){
    const x = 16 + i*22*k;
    if (i < bursts){ ctx.fillStyle = "#c9a7ff"; ctx.fillText("✦", x, row2); }
    else if (hc){ ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.2; ctx.strokeText("✦", x, row2); }
    else { ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillText("✦", x, row2); }
  }
  ctx.fillStyle = dimWhite(0.45);
  ctx.font = font(10);
  const abLabel = abilityName(Math.min(level, LEVELS.length-1)).toUpperCase();
  ctx.fillText((usedTouch ? "DOUBLE-TAP = " : "2x SPACE or X = ") + abLabel, 16, row2 + 24*k);
  /* level + progress */
  ctx.textAlign = "center";
  ctx.fillStyle = dimWhite(0.85);
  ctx.font = font(15, 600);
  ctx.fillText(`${cfg.name} · ${cfg.concept}`, W/2, 12);
  const row = 12 + 20*k;
  if (!boss){
    ctx.fillStyle = dimWhite(0.55);
    ctx.font = font(12);
    ctx.fillText(`eagles turned back: ${killCount} / ${quota}`, W/2, row);
  } else if (boss.entered){
    const bw = 300;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(W/2-bw/2, row, bw, 10);
    ctx.fillStyle = boss.enraged ? "#ff5a3c" : "#ff8c1a";
    ctx.fillRect(W/2-bw/2, row, bw * Math.max(0, boss.hp/boss.maxhp), 10);
    ctx.strokeStyle = hc ? "#ffffff" : "rgba(255,255,255,0.5)";
    ctx.strokeRect(W/2-bw/2, row, bw, 10);
  }
  /* score */
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd166";
  ctx.font = font(18, 700);
  ctx.fillText(String(score), W-16, 12);
  if (DIFF !== DIFFS.normal){
    ctx.font = font(10, 600);
    ctx.fillStyle = dimWhite(0.55);
    ctx.fillText(DIFF.label.toUpperCase(), W-16, 12 + 22*k);
  }
  ctx.textAlign = "left";
}
function drawBanner(){
  if (!banner) return;
  const a = Math.min(1, banner.t*3, (banner.max - banner.t)*2);
  ctx.save();
  ctx.globalAlpha = Math.max(0, a);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff";
  ctx.font = `800 ${Math.round(34 * hudScale())}px sans-serif`;
  ctx.shadowColor = "#9d7bff"; ctx.shadowBlur = 24;
  if (banner.text) ctx.fillText(banner.text, W/2, H/2 - 40);
  if (banner.sub){
    ctx.font = `600 ${Math.round(17 * hudScale())}px sans-serif`;
    ctx.fillStyle = "#ffd166";
    ctx.fillText(banner.sub, W/2, H/2 - 4);
  }
  ctx.restore();
}
/* A held sky reads as a pale blue wash that fades as the window runs out, so the player can see
   how much stillness is left without another number on the screen. */
function drawStillness(){
  const k = Math.min(1, stillT / STILL_TIME);
  ctx.save();
  ctx.fillStyle = `rgba(159,231,255,${0.10 + 0.10*k})`;
  ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle = `rgba(200,245,255,${0.35*k})`;
  ctx.lineWidth = 3;
  ctx.strokeRect(6, 6, W-12, H-12);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = `rgba(230,250,255,${0.55*k})`;
  ctx.font = "600 12px sans-serif";
  ctx.fillText("STILL", W/2, H - 22);   // bottom centre: the top strip already carries the level readout
  ctx.restore();
}
function draw(){
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  if (shake > 0) ctx.translate(rand(-shake,shake), rand(-shake,shake));
  drawBackground();
  if (highContrast()){ ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(-20,-20,W+40,H+40); }
  for (const m of motes) drawMote(m);
  for (const o of orbs) drawOrb(o);
  for (const e of eagles) drawEagle(e);
  if (boss) drawBoss();
  for (const f of fires) drawFire(f);
  /* bullets */
  for (const b of bullets){
    ctx.fillStyle = "rgba(150,230,255,0.35)";
    ctx.beginPath(); ctx.ellipse(b.x-8, b.y, 12, 3.5, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#eafcff";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill();
  }
  /* particles */
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    if (p.shape === "feather") ctx.ellipse(p.x, p.y, p.r * 1.9, p.r * 0.6, p.rot, 0, 6.28);
    else ctx.arc(p.x, p.y, p.r, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (pops.length){
    ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `800 ${Math.round(15 * hudScale())}px sans-serif`;
    for (const q of pops){
      ctx.globalAlpha = Math.max(0, 1 - q.t / 0.9);
      ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillText(q.text, q.x + 1, q.y + 1);
      ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
    }
    ctx.restore();
  }
  drawFairy();
  if (stillT > 0) drawStillness();
  if (state === "play" || state === "hit" || state === "pause" || state === "clear") drawHUD();
  drawBanner();
  if (hurtT > 0){
    const g = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.9);
    g.addColorStop(0, "rgba(255,40,70,0)"); g.addColorStop(1, `rgba(255,40,70,${0.45 * hurtT / 0.6})`);
    ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);
  }
  if (flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${flash*0.85})`;
    ctx.fillRect(-20,-20,W+40,H+40);
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.033) dt = 0.033;
  try {
    if (hitStop > 0){ hitStop = Math.max(0, hitStop - dt); draw(); }
    else { update(dt); draw(); }
  }
  catch(err){ console.error("Mindwing frame error:", err); }   // one bad frame must not freeze the game
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
showTitle();
checkClass();
})();
</script>
</body>
</html>
